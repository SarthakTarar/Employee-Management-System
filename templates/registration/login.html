{% extends "base.html" %}
{% block title %}Sign in · Employee Management System{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-people-fill text-primary" style="font-size:2rem;"></i>
      <h1 class="h4 mt-2 mb-0">Employee Management System</h1>
      <p class="text-muted small">Sign in to continue</p>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger py-2">Invalid username or password.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Username</label>
        <input type="text" name="username" autofocus class="form-control" id="id_username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Password</label>
        <input type="password" name="password" class="form-control" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
